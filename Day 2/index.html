<!DOCTYPE html>
<html lang="en">

<head>

        <meta charset="UTF-8">

        <meta
    name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Registration - Edutrack Student Portal</title>
        <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <!-- Main Registration Card -->
        <section class="portal-card">

            <!-- Header -->

            <div class="portal-header">

                <div class="company--brand">

                    <img
                        src="images/novatech-logo.png"
                        alt="NovaTech Digital Logo"
                        class="company-logo"
                    >

                    <span>
                        Powered by NovaTech Digital
                    </span>
                </div>

                <div class="edutrack-brand">

                    <div>
                        Edutrack
                    </div>

                    <div>
                        Student Portal
                    </div>
                </div>

            </div>

            <!--Registration Panel -->

            <div class="registration-panel">

                <h1>
                    CREATE ACCOUNT
                </h1>

                <form id="registrationForm">

                    <!--Name -->

                    <div class="form-group">

                        <label for="name">Name:</label>
                        <input type="text" id="name" required>

                    </div>

                    <!--Surname -->
                    <div class="form-group">
                        <label for="surname">Surname:</label>
                        <input type="text" id="surname" required>
                    </div>

                    <!--Student ID -->
                    <div class="form-group">
                        <label for="studentId">Student ID:</label>
                        <input type="number" id="studentId" required>
                    </div>

                    <!--Email -->
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>

                    <!--Password -->
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" required>
                    </div>

                    <!--Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="register-button">Register</button>

                    <!-- Back to Login -->
                    <div class="back-to-login">
                        <span>
                            Already have an account?
                        </span>

                        <a href="../Day%201/index.html">
                            Back to Login
                        </a>
                    </div>

                </form>
            </div>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>

</html>
